version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - PIP_DEFAULT_TIMEOUT=120
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # /healthz is the stable endpoint across all Qdrant versions.
      # /readyz was added later and may not exist on all builds.
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      # start_period gives Qdrant time to fully boot before health checks begin.
      # Without this, the first check fires while Qdrant is still loading and
      # immediately counts as a failure, causing the container to be marked unhealthy.
      start_period: 30s
    restart: unless-stopped

volumes:
  qdrant_storage:
